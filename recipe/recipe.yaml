context:
  version: 2.17.0

package:
  name: libimagequant
  version: ${{ version }}

source:
  - url: https://github.com/ImageOptim/libimagequant/archive/refs/tags/${{ version }}.tar.gz
    sha256: 9f6cc50182be4d2ece75118aa0b0fd3e9bbad06e94fd6b9eb3a4c08129c2dd26
    patches:
      - patches/0001-do-not-build-static-library.patch
      - if: win
        then: patches/0002-fix-some-OpenMP-for-loop-statements-for-windows.patch

build:
  number: 0
  script:
    file: build

requirements:
  run_exports:
    - ${{ pin_subpackage('libimagequant', exact=True) }}
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - pkg-config
    - make
    - cmake
    - if: linux
      then:
        - libgomp
      else:
        - llvm-openmp

tests:
  - package_contents:
      lib:
        - libimagequant
      include:
        - libimagequant.h
      files:
        exists:
          - lib/pkgconfig/imagequant.pc
        not_exists:
          # absence of static libraries
          - lib/libimagequant.a

about:
  summary: Palette quantization library that powers pngquant and other PNG optimizers
  license: GPL-3.0-or-later
  license_file:
    - imagequant-sys/LICENSE
    - imagequant-sys/THIRDPARTY.yml
  homepage: https://pngquant.org/lib/
  repository: https://github.com/ImageOptim/libimagequant

extra:
  recipe-maintainers:
    - "0xbe7a"
    - izahn
    - h-vetinari
